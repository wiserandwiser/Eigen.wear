<title>Eigen.wear</title>
<meta name="claude:viewport-fit-sides" content="cover">
<meta name="theme-color" content="#F6F1EA">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Instrument+Serif&family=Figtree:wght@400;500;600&family=JetBrains+Mono:wght@400;500&display=swap">
<style>
:root{
  --bg:#F6F1EA; --surface:#FFFCF8; --tile:#EAE4DA; --ink:#211C2B; --muted:#5E5866; --line:#E6DED6;
  --accent:#6E5FD9; --accent-ink:#FFFFFF; --gold:#FF8A6B; --gold-ink:#211C2B; --good:#2E7D4F; --warn:#9A5B12; --bad:#B8343F;
  --peach:#FFB58F; --pink:#FF8A9B; --lav:#A99BFF;
  --display:"Instrument Serif", "Iowan Old Style", Georgia, serif;
  --body:"Figtree", system-ui, -apple-system, "Segoe UI", sans-serif;
  --mono:"JetBrains Mono", ui-monospace, Menlo, monospace;
  --r:14px; --nav:64px; --fig:#D6CEC2;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#211C2B; --surface:#2B2537; --tile:#35312F; --ink:#F6F1EA; --muted:#CFC6DE; --line:#3F3752;
  --accent:#A99BFF; --accent-ink:#211C2B; --gold:#FF8A6B; --gold-ink:#211C2B; --good:#6CC08F; --warn:#F2B866; --bad:#FF8A9B; --fig:#4A4541; color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#211C2B; --surface:#2B2537; --tile:#35312F; --ink:#F6F1EA; --muted:#CFC6DE; --line:#3F3752;
  --accent:#A99BFF; --accent-ink:#211C2B; --gold:#FF8A6B; --gold-ink:#211C2B; --good:#6CC08F; --warn:#F2B866; --bad:#FF8A9B; --fig:#4A4541; color-scheme:dark}
*{box-sizing:border-box}
html,body{background:var(--bg);color:var(--ink)}
body{font-family:var(--body);font-size:15px;line-height:1.45;-webkit-tap-highlight-color:transparent}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:30;background:var(--bg)}
button,input,select{font:inherit;color:inherit}
button{cursor:pointer}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.wrap{max-width:560px;margin:0 auto;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-block:0 calc(var(--nav) + 28px + env(safe-area-inset-bottom,0px))}
header.top{position:sticky;top:env(safe-area-inset-top,0px);z-index:20;background:var(--bg);display:flex;align-items:center;justify-content:space-between;gap:12px;padding-block:14px 10px}
.mark{display:flex;align-items:center;gap:8px;font-family:var(--display);font-weight:400;font-size:27px;letter-spacing:-.01em;line-height:1}
.mark svg{width:28px;height:28px;flex:none}
.mark .wmdot{color:var(--gold)}
.mark i{display:flex;gap:2px}
.mark i b{width:6px;height:18px;border-radius:3px;display:block}
.vtitle{font-size:12px;letter-spacing:.08em;text-transform:uppercase;color:var(--muted)}
h2{font-family:var(--display);font-weight:700;font-size:26px;letter-spacing:-.015em;margin:6px 0 4px;text-wrap:balance}
h3{font-family:var(--display);font-weight:500;font-size:17px;margin:0}
.sub{color:var(--muted);margin:0 0 14px;font-size:14px}
.label{font-size:11px;letter-spacing:.09em;text-transform:uppercase;color:var(--muted);font-weight:600}
.row{display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.chips{display:flex;gap:6px;overflow-x:auto;padding-bottom:4px;scrollbar-width:none}
.chips::-webkit-scrollbar{display:none}
.chip{flex:none;border:1px solid var(--line);background:var(--surface);border-radius:999px;padding:6px 12px;font-size:13px;font-weight:500;white-space:nowrap}
.chip[aria-pressed="true"]{background:var(--ink);color:var(--bg);border-color:var(--ink)}
.btn{border:1px solid var(--line);background:var(--surface);border-radius:12px;padding:10px 14px;font-weight:600;font-size:14px;display:inline-flex;align-items:center;gap:8px;justify-content:center}
.btn.primary{background:linear-gradient(135deg,var(--peach),var(--pink));color:#211C2B;border-color:transparent}
.btn.ghost{background:transparent}
.btn.danger{color:var(--bad)}
.btn:disabled{opacity:.45}
.btn.sm{padding:7px 10px;font-size:13px;border-radius:10px}
.icon{width:18px;height:18px;flex:none}
.card{background:var(--surface);border:1px solid var(--line);border-radius:var(--r)}
.note{font-size:13px;color:var(--muted)}
.banner{display:flex;gap:10px;align-items:center;justify-content:space-between;background:var(--surface);border:1px dashed var(--line);border-radius:12px;padding:10px 12px;margin-bottom:14px;font-size:13px}


nav.tabs{position:fixed;left:0;right:0;bottom:0;z-index:25;background:var(--surface);border-top:1px solid var(--line);padding-bottom:env(safe-area-inset-bottom,0px);padding-left:env(safe-area-inset-left,0px);padding-right:env(safe-area-inset-right,0px)}
nav.tabs .in{max-width:560px;margin:0 auto;display:grid;grid-template-columns:repeat(5,1fr);height:var(--nav)}
nav.tabs button{position:relative}
nav.tabs .badge{position:absolute;top:6px;left:calc(50% + 6px);min-width:17px;height:17px;border-radius:9px;background:var(--gold);color:var(--gold-ink);font-weight:700;font-size:10px;display:grid;place-items:center;padding:0 4px;font-family:var(--mono)}
.ibtn.heart[aria-pressed="true"]{background:var(--surface);color:var(--bad);border-color:var(--bad)}
.ibtn.heart[aria-pressed="true"] svg,.btn.heart[aria-pressed="true"] svg{fill:currentColor}
.btn.heart[aria-pressed="true"]{color:var(--bad);border-color:var(--bad)}
.favh{color:var(--bad);font-size:12px;line-height:12px}
.welcome{position:fixed;inset:0;z-index:70;background:var(--bg);display:flex;flex-direction:column;justify-content:center;gap:22px;padding-block:24px;padding-left:max(24px,env(safe-area-inset-left,0px));padding-right:max(24px,env(safe-area-inset-right,0px))}
.welcome .in{max-width:420px;margin:0 auto;width:100%;display:flex;flex-direction:column;gap:18px}
.welcome h1{font-family:var(--display);font-size:40px;line-height:1;letter-spacing:-.02em;margin:0}
.welcome .pick2{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.welcome .pick2 button{border:1px solid var(--line);background:var(--surface);border-radius:16px;padding:22px 10px;font-family:var(--display);font-size:20px;font-weight:700}
.welcome .pick2 button:active{border-color:var(--accent)}
nav.tabs button{border:0;background:none;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:3px;font-size:11px;font-weight:600;color:var(--muted)}
nav.tabs button[aria-current="page"]{color:var(--ink)}
nav.tabs button[aria-current="page"] svg{color:var(--accent)}
nav.tabs svg{width:22px;height:22px}


.grid{display:grid;grid-template-columns:repeat(3,1fr);gap:10px}
@media (max-width:380px){.grid{grid-template-columns:repeat(2,1fr)}}
.tile{position:relative;aspect-ratio:4/5;max-width:100%;background:var(--tile);border-radius:12px;border:0;padding:0;overflow:hidden;display:block;width:100%}
.tile img{position:absolute;inset:8%;width:84%;height:84%;object-fit:contain}
.tile .dots{position:absolute;left:8px;bottom:8px;display:flex;gap:3px}
.dot{width:12px;height:12px;border-radius:50%;box-shadow:0 0 0 1px rgba(127,127,127,.35) inset;display:inline-block;flex:none}
.tile .wc{position:absolute;right:8px;top:7px;font-family:var(--mono);font-size:10px;color:var(--muted)}
.tile .cnt{position:absolute;right:8px;bottom:7px;font-family:var(--mono);font-size:10px;color:var(--muted)}
.tile .wash{position:absolute;left:6px;right:6px;top:22px;background:var(--surface);color:var(--ink);border-radius:8px;padding:3px 6px;font-size:10px;font-weight:600;text-align:center}
.tile.dirty img{opacity:.35}
.tile .ph{position:absolute;inset:10%;border-radius:10px;display:grid;place-items:center}
.ph small{background:var(--surface);color:var(--ink);font-size:9px;font-weight:600;padding:2px 6px;border-radius:6px}
.hero .ph{width:60%;height:60%;border-radius:14px;display:grid;place-items:center}
.ov{position:relative;width:100%;max-width:100%;background:var(--tile);border-radius:14px;overflow:hidden}
.ovg{display:grid;grid-template-columns:2fr 1fr;gap:6px;padding:6px;align-items:start}
.ovg.noside{grid-template-columns:1fr}
.ovc{display:flex;flex-direction:column;gap:6px;min-width:0}
.ovt{position:relative;display:block;aspect-ratio:1/1;background:var(--surface);border-radius:10px;overflow:hidden;cursor:pointer}
.ovg.noside .ovt{aspect-ratio:4/3}
.ovt>img{position:absolute;inset:8%;width:84%;height:84%;object-fit:contain}
.ovt .ovpair{position:absolute;inset:8%;display:flex;align-items:center;justify-content:center;gap:2%}
.ovt .ovpair img{width:49%;height:100%;object-fit:contain}
.ovt .ovph{position:absolute;inset:18%;border-radius:10px;opacity:.85}
.mixov .ovg{grid-template-columns:2fr .75fr}
.mixov .ovg>.ovc:first-child{display:grid;grid-template-columns:1fr 1fr}
.mixov .ovg.noside{grid-template-columns:1fr}
.mixov .ovg.noside>.ovc:first-child{grid-template-columns:1fr 1fr 1fr}
.mixov .ovg.noside .ovt{aspect-ratio:1/1}
.ov .fig{position:absolute;inset:0;width:100%;height:100%}
.dayrow{display:grid;grid-template-columns:46% 1fr;gap:12px;align-items:start}
.dayrow .side{min-width:0;display:flex;flex-direction:column;gap:8px}
.dayrow .dayacts .btn{flex:1 1 auto}
.mixov{max-width:340px;margin:10px auto 0;display:flex;flex-direction:column;gap:8px}
.toast{display:flex;align-items:center;gap:8px}
.toast.quip{width:min(350px,calc(100% - 32px));background:var(--surface);color:var(--ink);border:1px solid var(--accent);box-shadow:0 6px 24px rgba(0,0,0,.18)}
.toast.quip svg{color:var(--accent);flex:none}
h1,h2,h3,.dayname,.stat b,.welcome h1,.welcome .pick2 button{font-weight:400}
h2{font-size:32px;letter-spacing:-.01em}
.dayname{font-size:22px}
.welcome h1{font-size:56px}
.tile .ex{position:absolute;left:8px;top:7px;font-size:9px;letter-spacing:.08em;text-transform:uppercase;color:var(--muted);font-weight:600}
.palbar{display:flex;height:14px;border-radius:7px;overflow:hidden;margin:4px 0 14px;box-shadow:0 0 0 1px var(--line)}
.palbar span{display:block;height:100%}


.rhythm{display:grid;grid-template-columns:repeat(7,1fr);gap:4px;margin:6px 0 14px}
.rhythm .col{display:flex;flex-direction:column;border-radius:6px;overflow:hidden;height:64px;background:var(--tile)}
.rhythm .col span{flex:1}
.rhythm small{display:block;text-align:center;font-size:10px;color:var(--muted);margin-top:3px;font-weight:600}
.days{display:flex;flex-direction:column;gap:10px}
.day{padding:12px;display:flex;flex-direction:column;gap:10px}
.day.today{border-color:var(--accent);box-shadow:0 0 0 1px var(--accent)}
.dayhead{display:flex;justify-content:space-between;align-items:center;gap:8px}
.dayname{font-family:var(--display);font-weight:700;font-size:18px}
.dayname small{font-family:var(--body);font-weight:500;font-size:13px;color:var(--muted);margin-left:6px}
.strip{display:flex;gap:6px;overflow-x:auto;scrollbar-width:none}
.strip::-webkit-scrollbar{display:none}
.strip .tile{flex:none;width:68px}
.score{font-family:var(--mono);font-size:12px;padding:3px 8px;border-radius:999px;border:1px solid var(--line);white-space:nowrap}
.score.g{color:var(--good)} .score.w{color:var(--warn)} .score.b{color:var(--bad)}
.dayacts{display:flex;gap:6px;flex-wrap:wrap}
.worn[aria-pressed="true"]{background:var(--good);border-color:var(--good);color:#fff}


.board{display:flex;flex-direction:column;gap:8px}
.slot{display:grid;grid-template-columns:76px 1fr auto;gap:12px;align-items:center;padding:8px}
.slot .tile{width:76px}
.slot .meta{min-width:0}
.slot .meta b{display:block;font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.slot .acts{display:flex;gap:4px}
.ibtn{width:36px;height:36px;border-radius:10px;border:1px solid var(--line);background:var(--surface);display:grid;place-items:center;padding:0}
.ibtn[aria-pressed="true"]{background:var(--ink);color:var(--bg);border-color:var(--ink)}
.slot.off{opacity:.5}
.ibtn[data-w][aria-pressed="false"] svg,.ibtn[data-lt][aria-pressed="false"] svg{opacity:0}
.verdict{padding:14px;display:flex;gap:14px;align-items:center;margin:12px 0}
.meter{flex:none;width:58px;height:58px;border-radius:50%;display:grid;place-items:center;font-family:var(--mono);font-weight:500;font-size:16px}
.verdict p{margin:2px 0 0;font-size:14px}
.swatches{display:flex;gap:4px;margin-top:8px}
.swatches .dot{width:18px;height:18px}
.sticky-acts{display:flex;gap:8px;margin-top:12px}
.sticky-acts .btn{flex:1}


.sheet{position:fixed;inset:0;z-index:40;background:var(--bg);display:flex;flex-direction:column;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
.sheet .bar{display:flex;align-items:center;justify-content:space-between;gap:8px;padding-block:10px;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));border-bottom:1px solid var(--line)}
.sheet .body{flex:1;overflow-y:auto;padding-block:14px 28px;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
.howto{position:fixed;inset:0;z-index:80;background:rgba(33,28,43,.55);display:flex;align-items:center;justify-content:center;padding:16px}
.howto .hin{background:var(--bg);border-radius:24px;padding:20px;max-width:380px;width:100%;max-height:100%;overflow:auto;display:flex;flex-direction:column;gap:14px;align-items:center}
.howto .ph{width:200px;height:400px;border-radius:34px;background:#211C2B;padding:9px;flex:none}
.howto .scr{position:relative;width:182px;height:382px;border-radius:26px;overflow:hidden;background:#fff}
.howto .scr>div{position:absolute}
.a-photos{inset:0;background:#fff}
.a-top{position:absolute;left:12px;top:14px;font:600 12px Figtree,system-ui,sans-serif;color:#0A84FF}
.a-bed{position:absolute;left:0;right:0;top:44px;bottom:30px;background:linear-gradient(160deg,#EADFCB,#D9CBB2)}
.a-dim{inset:0;background:#000;opacity:0;animation:aDim 10s infinite}
.a-shirt{left:31px;top:121px;width:120px;height:120px;animation:aShirt 10s infinite}
.a-shirt svg,.a-drop svg{width:100%;height:100%;display:block}
.a-menu{left:28px;top:84px;display:flex;background:rgba(245,245,247,.97);border-radius:10px;overflow:hidden;font:600 12px Figtree,system-ui,sans-serif;color:#111;box-shadow:0 6px 18px rgba(0,0,0,.25);opacity:0;animation:aMenu 10s infinite}
.a-menu span{padding:8px 13px}.a-menu span+span{border-left:1px solid #ddd}
.a-copy{animation:aCopy 10s infinite}
.a-app{inset:0;background:var(--bg,#F6F1EA);opacity:0;animation:aApp 10s infinite}
.a-bar{left:0;right:0;top:0;padding:14px 12px 10px;font:600 11px Figtree,system-ui,sans-serif;color:#5E5866;border-bottom:1px solid rgba(0,0,0,.08);position:absolute}
.a-bar b{color:#211C2B;margin-left:22px;font-size:12px}
.a-paste{position:absolute;left:14px;right:14px;top:126px;height:40px;border-radius:999px;background:linear-gradient(135deg,#FFB58F,#FF8A9B);font:700 13px/40px Figtree,system-ui,sans-serif;text-align:center;color:#211C2B;animation:aPaste 10s infinite}
.a-tile{position:absolute;left:36px;top:196px;width:110px;height:130px;border-radius:14px;background:#EAE4DA}
.a-drop{position:absolute;left:15px;top:20px;width:80px;height:90px;opacity:0;animation:aDrop 10s infinite}
.a-finger{left:0;top:0;width:36px;height:36px;border-radius:50%;background:rgba(33,28,43,.32);border:3px solid rgba(255,255,255,.9);box-shadow:0 2px 8px rgba(0,0,0,.3);opacity:0;animation:aFinger 10s infinite}
.a-steps{margin:0;padding-left:22px;display:flex;flex-direction:column;gap:6px;font-size:15px;line-height:1.35;width:100%}
.a-steps li{opacity:.35;animation:10s infinite}
.a-steps .s1{animation-name:aS1}.a-steps .s2{animation-name:aS2}.a-steps .s3{animation-name:aS3}.a-steps .s4{animation-name:aS4}
@keyframes aS1{0%,22%{opacity:1;font-weight:600}24%,100%{opacity:.35;font-weight:400}}
@keyframes aS2{0%,23%{opacity:.35}25%,40%{opacity:1;font-weight:600}42%,100%{opacity:.35;font-weight:400}}
@keyframes aS3{0%,41%{opacity:.35}43%,62%{opacity:1;font-weight:600}64%,100%{opacity:.35;font-weight:400}}
@keyframes aS4{0%,63%{opacity:.35}65%,97%{opacity:1;font-weight:600}100%{opacity:.35}}
@keyframes aDim{0%,20%{opacity:0}26%,62%{opacity:.35}64%,100%{opacity:0}}
@keyframes aShirt{0%,20%{transform:none;filter:none;opacity:1}26%{transform:translateY(-6px) scale(1.06);filter:drop-shadow(0 0 6px #fff) drop-shadow(0 0 12px #fff)}33%{filter:drop-shadow(0 0 2px #fff) drop-shadow(0 0 5px #fff)}40%,62%{transform:translateY(-6px) scale(1.06);filter:drop-shadow(0 0 6px #fff) drop-shadow(0 0 12px #fff);opacity:1}64%,100%{opacity:0;transform:none;filter:none}}
@keyframes aMenu{0%,42%{opacity:0;transform:translateY(6px)}45%,62%{opacity:1;transform:none}64%,100%{opacity:0}}
@keyframes aCopy{0%,50%{background:transparent}52%,58%{background:#D1D1D6}60%,100%{background:transparent}}
@keyframes aApp{0%,64%{opacity:0}67%,97%{opacity:1}100%{opacity:0}}
@keyframes aPaste{0%,76%{transform:none}78%,80%{transform:scale(.94);filter:brightness(.92)}82%,100%{transform:none;filter:none}}
@keyframes aDrop{0%,81%{opacity:0;transform:translateY(-40px) scale(.7)}86%{opacity:1;transform:translateY(4px) scale(1.04)}89%,97%{opacity:1;transform:none}100%{opacity:0}}
@keyframes aFinger{0%{opacity:0;transform:translate(150px,390px)}8%{opacity:1;transform:translate(73px,163px)}14%{transform:translate(73px,163px) scale(1)}16%,30%{transform:translate(73px,163px) scale(.8)}34%{transform:translate(73px,163px) scale(1);opacity:1}43%{transform:translate(32px,78px)}50%{transform:translate(32px,78px) scale(1)}52%,55%{transform:translate(32px,78px) scale(.8)}58%{transform:translate(32px,78px) scale(1);opacity:1}63%,68%{opacity:0;transform:translate(150px,390px)}74%{opacity:1;transform:translate(73px,128px)}77%,80%{transform:translate(73px,128px) scale(.8)}83%{opacity:1;transform:translate(73px,128px) scale(1)}90%,100%{opacity:0;transform:translate(150px,390px)}}
@media (prefers-reduced-motion:reduce){.howto *{animation-duration:30s!important}}
.why{margin:4px 0 6px;padding:0;list-style:none;display:flex;flex-direction:column;gap:3px}.why li{font-size:15px;line-height:1.35}.why li.sub{font-size:13px;color:var(--muted)}
.bkrem{display:flex;gap:12px;align-items:center;justify-content:space-between;flex-wrap:wrap;padding:14px 16px;border:1px solid var(--accent);margin-bottom:12px}
.howitworks summary{cursor:pointer;font-weight:600;padding:12px 0;list-style-position:inside}
.howitworks p{margin:0 0 10px;line-height:1.45}
.tips{margin:8px 0 0;padding-left:20px;display:flex;flex-direction:column;gap:8px;line-height:1.4}
.sheet .body>.in{max-width:560px;margin:0 auto;display:flex;flex-direction:column;gap:16px}
.field{display:flex;flex-direction:column;gap:6px}
.field input[type=text]{border:1px solid var(--line);background:var(--surface);border-radius:10px;padding:10px 12px}
.colrow{display:flex;gap:10px;flex-wrap:wrap;align-items:center}
.colitem{display:flex;align-items:center;gap:6px;border:1px solid var(--line);background:var(--surface);border-radius:999px;padding:4px 10px 4px 4px;font-size:13px}
.colitem .dot{width:22px;height:22px}
.colitem button{border:0;background:none;padding:0 0 0 4px;color:var(--muted);font-size:16px;line-height:1}
.colitem input{position:absolute;opacity:0;width:0;height:0}
.colitem label{cursor:pointer;display:flex}
.hero{background:var(--tile);border-radius:var(--r);aspect-ratio:1/1;max-width:100%;display:grid;place-items:center;overflow:hidden}
.hero img{max-width:86%;max-height:86%;object-fit:contain}
.hero.pin{position:sticky;top:-14px;z-index:3;aspect-ratio:auto;height:min(32vh,250px);box-shadow:0 8px 16px -10px rgba(0,0,0,.25)}
.hero.pin img{cursor:crosshair;max-height:90%}
.pickring{position:absolute;width:30px;height:30px;margin:-15px 0 0 -15px;border-radius:50%;border:3px solid #fff;box-shadow:0 0 0 1px rgba(0,0,0,.3),0 2px 6px rgba(0,0,0,.3);pointer-events:none}
.hero{position:relative}
.colitem .sw{display:flex;align-items:center;gap:6px;border:0;background:none;padding:0;font:inherit;color:inherit;cursor:pointer}
.colitem.on,.btn.on{outline:2px solid var(--accent);outline-offset:1px}


.stage{position:relative;overflow:hidden;display:flex;align-items:center;justify-content:center;min-height:200px;border-radius:var(--r);background-color:#fff;background-image:linear-gradient(45deg,#e6e6e6 25%,transparent 25%),linear-gradient(-45deg,#e6e6e6 25%,transparent 25%),linear-gradient(45deg,transparent 75%,#e6e6e6 75%),linear-gradient(-45deg,transparent 75%,#e6e6e6 75%);background-size:20px 20px;background-position:0 0,0 10px,10px -10px,-10px 0;max-height:56vh}
.loupe{position:fixed;z-index:60;width:120px;height:120px;border-radius:50%;border:3px solid #fff;box-shadow:0 6px 20px rgba(0,0,0,.35);pointer-events:none;background:#fff}
#ghostBtn[aria-pressed="true"]{background:var(--ink);color:var(--bg);border-color:var(--ink)}
.stage canvas{display:block;width:auto;height:auto;max-width:100%;max-height:56vh;touch-action:none}
.tools{display:grid;grid-template-columns:repeat(5,1fr);gap:6px}
.tool{border:1px solid var(--line);background:var(--surface);border-radius:12px;padding:8px 4px;display:flex;flex-direction:column;align-items:center;gap:4px;font-size:11px;font-weight:600}
.tool[aria-pressed="true"]{border-color:var(--accent);color:var(--accent);box-shadow:0 0 0 1px var(--accent) inset}
.slider{display:grid;grid-template-columns:76px 1fr 36px;gap:10px;align-items:center;font-size:13px}
.slider output{font-family:var(--mono);font-size:12px;text-align:right;color:var(--muted)}
input[type=range]{width:100%;accent-color:var(--accent)}
.steps{display:flex;gap:6px;font-size:12px;color:var(--muted)}
.steps b{color:var(--ink)}


.plist{display:grid;grid-template-columns:repeat(3,1fr);gap:10px}
.pick{border:0;background:none;padding:0;text-align:left;display:flex;flex-direction:column;gap:4px;font-size:12px}
.pick .score{align-self:flex-start}

.stats{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
.stat{padding:12px}
.stat b{display:block;font-family:var(--display);font-size:24px;font-variant-numeric:tabular-nums}
.stat span{font-size:12px;color:var(--muted)}
.list{display:flex;flex-direction:column}
.list .li{display:flex;align-items:center;gap:10px;padding:8px 0;border-bottom:1px solid var(--line)}
.list .li:last-child{border-bottom:0}
.list .li .tile{width:44px;flex:none}
.list .li div{flex:1;min-width:0}
.mono{font-family:var(--mono);font-variant-numeric:tabular-nums}
section.block{display:flex;flex-direction:column;gap:10px;margin-bottom:22px}
.empty{padding:28px 16px;text-align:center;color:var(--muted);display:flex;flex-direction:column;gap:12px;align-items:center}
.toast{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(var(--nav) + 14px + env(safe-area-inset-bottom,0px));z-index:60;background:var(--ink);color:var(--bg);padding:10px 16px;border-radius:12px;font-size:14px;font-weight:500;max-width:calc(100% - 32px)}
.daypick{display:grid;grid-template-columns:repeat(7,1fr);gap:6px}
.daypick button{border:1px solid var(--line);background:var(--surface);border-radius:10px;padding:8px 0;font-size:12px;font-weight:600;display:flex;flex-direction:column;align-items:center}
.daypick button small{font-weight:400;color:var(--muted)}
.daypick button.filled{border-style:dashed}

function blobToDataURL(b) {

    const f = new FileReader();
    f.onload = () => r(f.result);

function dataURLToBlob(u) {

  const bin = atob(b64);
  const a = new Uint8Array(bin.length);
  for (let i = 0; i < bin.length; i++) a[i] = bin.charCodeAt(i);

const SHEETS = [];
let ignorePop = 0;
function sheet(title, rightHTML = "", opts = {}) {
  const el = h(`<div class="sheet" role="dialog" aria-label="${esc(title)}"><div class="bar"><button class="btn sm ghost" data-close>${ICON.back}Back</button><h3 style="flex:1;text-align:center;white-space:nowrap;overflow:hidden;text-overflow:ellipsis">${esc(title)}</h3><div style="min-width:64px;display:flex;justify-content:flex-end">${rightHTML}</div></div><div class="body"><div class="in"></div></div></div>`);
  document.body.appendChild(el);
  document.body.style.overflow = "hidden";
  window.scrollTo(0, 0);
  const entry = { el, popped: false };
  const close = () => {
    if (!el.isConnected) return;
    el.remove();
    const i = SHEETS.indexOf(entry);
    if (i >= 0) SHEETS.splice(i, 1);
    if (!entry.popped) {
      ignorePop++;
      try {
        history.back();
      } catch (e) {
        ignorePop--;
      }
    }
    if (!$(".sheet")) document.body.style.overflow = "";
  };
  entry.back = () => {
    if (opts.onBack) opts.onBack();
    else close();
  };
  SHEETS.push(entry);
  try {
    history.pushState({ eigSheet: SHEETS.length }, "");
  } catch (e) {
  }
  el.querySelector("[data-close]").onclick = () => entry.back();
  return { el, body: el.querySelector(".body .in"), bar: el.querySelector(".bar"), close };
}
document.addEventListener("focusout", () => {
  if (SHEETS.length) setTimeout(() => {
    if (!document.activeElement || document.activeElement === document.body || !document.activeElement.matches("input,textarea")) window.scrollTo(0, 0);
  }, 60);
});
addEventListener("popstate", () => {
  if (ignorePop) {
    ignorePop--;
    return;
  }
  const top = SHEETS[SHEETS.length - 1];
  if (!top) return;
  top.popped = true;
  top.back();
  if (top.el.isConnected) {
    top.popped = false;
    try {
      history.pushState({ eigSheet: SHEETS.length }, "");
    } catch (e) {
    }
  }
});
function attachPicker(hero, d, form) {
  const img = hero.querySelector("img");
  if (!img) return;
  hero.classList.add("pin");
  const cv = document.createElement("canvas"), cx = cv.getContext("2d", { willReadFrequently: true });
  let ready = false;
  const prep = () => {
    cv.width = img.naturalWidth;
    cv.height = img.naturalHeight;
    cx.drawImage(img, 0, 0);
    ready = true;
  };
  if (img.complete && img.naturalWidth) prep();
  else img.addEventListener("load", prep, { once: true });
  const ring = h(`<span class="pickring" hidden></span>`);
  hero.appendChild(ring);
  img.addEventListener("click", (e) => {
    if (!ready) return;
    const r = img.getBoundingClientRect();
    const x = Math.round((e.clientX - r.left) / r.width * cv.width), y = Math.round((e.clientY - r.top) / r.height * cv.height);
    const px = cx.getImageData(Math.max(0, x - 3), Math.max(0, y - 3), 7, 7).data;
    let R = 0, G = 0, B = 0, n = 0;
    for (let i = 0; i < px.length; i += 4) if (px[i + 3] > 128) {
      R += px[i];
      G += px[i + 1];
      B += px[i + 2];
      n++;
    }
    if (!n) {
      toast("That spot is background. Tap on the piece.");
      return;
    }
    const hex = rgbToHex(Math.round(R / n), Math.round(G / n), Math.round(B / n));
    const hr = hero.getBoundingClientRect();
    ring.hidden = false;
    ring.style.left = e.clientX - hr.left + "px";
    ring.style.top = e.clientY - hr.top + "px";
    ring.style.background = hex;
    if (typeof d.pick === "number") d.colours[d.pick].hex = hex;
    else if (d.colours.length < 4) {
      d.colours.push({ hex, share: 0.1 });
      const t = d.colours.reduce((s, c) => s + c.share, 0);
      d.colours.forEach((c) => c.share = c.share / t);
    } else d.colours[d.colours.length - 1].hex = hex;
    d.pick = null;
    form._draw();
    toast(`${colourName(hexToLab(hex))} picked`);
  });
}
